# Builds and tests Home Sorter on every push. The debug APK is attached to the run as an artifact;
# a push to main also publishes it as a GitHub Release, which gives a plain download link.
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK after the version
        id: apk
        run: |
          v=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "HomeSorter-$v.apk"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeSorter-${{ steps.apk.outputs.version }}-${{ github.run_number }}
          path: HomeSorter-${{ steps.apk.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
      - name: Release (main only)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="v${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          gh release create "$tag" "HomeSorter-${{ steps.apk.outputs.version }}.apk" \
            --title "Home Sorter ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Debug build of ${{ github.sha }}. Signed with the repo's debug key, so it installs over earlier builds from this repo."
